name: Update Currently Section

on:
  schedule:
    # Roda uma vez por hora (ajuste se quiser)
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get latest pushed repo
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Pega o repositório mais recente com push (qualquer repo do usuário)
          RESP=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/users/rytsan/repos?sort=pushed&direction=desc&per_page=1")

          NAME=$(echo "$RESP" | jq -r '.[0].name')
          PUSHED_AT=$(echo "$RESP" | jq -r '.[0].pushed_at')

          # Converte para algo legível (ex.: "rytsan/agent-local – há 2 dias")
          # Aqui vamos usar apenas o nome e a data ISO; você pode formatar como quiser.
          echo "repo_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "pushed_at=$PUSHED_AT" >> "$GITHUB_OUTPUT"

      - name: Update README
        run: |
          # Substitui a linha que começa com "- 🔭 **Trabalhando em**:"
          # Mantém o resto do README intacto.
          python3 - <<'PY'
import re, os

readme_path = "README.md"
with open(readme_path, "r", encoding="utf-8") as f:
    content = f.read()

repo_name = os.environ["REPO_NAME"]
pushed_at = os.environ["PUSHED_AT"]

# Monta a linha de "Trabalhando em"
new_line = f"- 🔭 **Trabalhando em**: [{repo_name}](https://github.com/rytsan/{repo_name}) – última atividade: {pushed_at}"

# Padrão: linha que começa com "- 🔭 **Trabalhando em**:"
pattern = r"^- 🔭 \*\*Trabalhando em\*\*:.*$"

lines = content.splitlines()
new_lines = []
replaced = False
for line in lines:
    if not replaced and re.match(pattern, line):
        new_lines.append(new_line)
        replaced = True
    else:
        new_lines.append(line)

new_content = "\n".join(new_lines)

with open(readme_path, "w", encoding="utf-8") as f:
    f.write(new_content)
PY

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update Currently section" && git push)
        env:
          REPO_NAME: ${{ steps.latest.outputs.repo_name }}
          PUSHED_AT: ${{ steps.latest.outputs.pushed_at }}
